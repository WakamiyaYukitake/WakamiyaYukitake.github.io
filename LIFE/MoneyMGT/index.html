<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
  <title>MoneyMGT — お金の管理</title>
  <meta name="description" content="複数口座の残高・入出金・払い戻し・収入予定・サブスクをカレンダーで管理するアプリ。" />
  <meta name="theme-color" content="#12161c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MoneyMGT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">MoneyMGT <span id="app-version" class="ver"></span></div>
      <div class="status">
        <div id="status-main">読み込み中…</div>
        <div id="status-sub" class="sub">&nbsp;</div>
      </div>
      <button id="btn-settings" class="icon-btn" aria-label="設定を開く">⚙</button>
    </header>

    <main id="views">
      <!-- 概要（口座残高＋シミュレーション） -->
      <section id="view-overview" class="view">
        <div id="ov-total" class="hero-card"></div>
        <div id="ov-accounts" class="account-list"></div>

        <section class="panel">
          <div class="panel-head">
            <h2>カレンダーで見る</h2>
          </div>
          <div class="segment" id="cal-balance-mode">
            <button class="segment-btn active" data-mode="effective">実質残高</button>
            <button class="segment-btn" data-mode="actual">実際の口座残高</button>
          </div>
          <div class="cal-head">
            <button id="cal-prev" class="icon-btn small" aria-label="前の月">‹</button>
            <div id="cal-title" class="cal-title"></div>
            <button id="cal-next" class="icon-btn small" aria-label="次の月">›</button>
          </div>
          <div class="cal-weekdays">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
          <div id="cal-detail" class="cal-detail"></div>

          <div class="panel-sub">
            <h3>カード別の月間支払い</h3>
            <div class="segment" id="card-totals-mode">
              <button class="segment-btn active" data-mode="confirmed">確定のみ</button>
              <button class="segment-btn" data-mode="withPlanned">予定を含む</button>
            </div>
            <div id="card-totals-list" class="list-mini"></div>
          </div>
        </section>
      </section>

      <!-- 入出（支出・収入・払い戻し） -->
      <section id="view-ledger" class="view" hidden>
        <div class="segment" id="ledger-tabs">
          <button class="segment-btn active" data-kind="expense">支出</button>
          <button class="segment-btn" data-kind="income">収入</button>
          <button class="segment-btn" data-kind="refund">払い戻し</button>
        </div>
        <div id="ledger-list" class="entry-list"></div>
      </section>

      <!-- バイト（シフト記録） -->
      <section id="view-jobs" class="view" hidden>
        <p class="note intro">バイト先を登録しておけば、働いた日と時間を入力するだけで自動的に金額を計算し、収入（予定）として登録します。フリーランスやUber Eatsなど不定期な収入は「入出」タブの収入から個別に入力してください。</p>
        <div id="jobs-list" class="list-mini"></div>
        <div class="btn-row"><button class="btn full" id="btn-add-job">＋ バイト先を追加</button></div>

        <section class="panel">
          <div class="panel-head"><h2>シフト履歴</h2></div>
          <div id="shifts-list" class="entry-list"></div>
        </section>
      </section>

      <!-- サブスク -->
      <section id="view-subs" class="view" hidden>
        <p class="note intro">有効なサブスクは毎月の請求日に自動でカレンダーへ反映されます（履歴として個別入力する必要はありません）。</p>
        <div id="subs-total" class="hero-card small"></div>
        <div id="subs-list" class="entry-list"></div>
      </section>
    </main>

    <footer id="bottombar">
      <button class="bar-btn active" data-view="overview">
        <span class="bar-icon">💰</span><span class="bar-text">概要</span>
      </button>
      <button class="bar-btn" data-view="ledger">
        <span class="bar-icon">📝</span><span class="bar-text">入出</span>
      </button>
      <button class="bar-btn" data-view="jobs">
        <span class="bar-icon">💼</span><span class="bar-text">バイト</span>
      </button>
      <button class="bar-btn" data-view="subs">
        <span class="bar-icon">🔁</span><span class="bar-text">サブスク</span>
      </button>
    </footer>

    <button id="btn-fab" class="fab" aria-label="追加">＋</button>
  </div>

  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden>
    <div class="sheet-head">
      <h2 id="sheet-title">タイトル</h2>
      <button id="btn-sheet-close" class="icon-btn" aria-label="閉じる">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
